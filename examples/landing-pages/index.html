<!-- =================== SCRIPTS ===================  -->
<script src="https://cdn.jsdelivr.net/npm/c0ckp1t@1.0.15/js_ext/loglevel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/c0ckp1t@1.0.15/js_ext/loglevel-plugin-prefix.min.js"></script>

<script type="module">
  import {init as initLogger} from 'Logging';
  import {api as apiMain} from 'GlobalStore'
  import { defaultVueComponents } from 'ConfigUtils'

  const CDN = "https://cdn.jsdelivr.net/npm/c0ckp1t@1.0.15"

  // The entire app config — one explicit object (no factory, no merge).
  const config = {
    isDev: false,
    WITH_CREDENTIALS: false,
    defaultInstanceId: "default",
    instanceId: "default",
    type: "IslandDefault",
    appMainComponent: "./PageMain.vue",
    appEndpoint: CDN,
    showSidebar: false,
    componentsDefaultExpand: true,
    componentPrefix: CDN,
    appName: "Landing Page Example",
    showTopNavBar: true,
    navItems: [],
    showFooter: true,
    vueRouterModeIsHash: true,
    routePrefix: CDN,
    defaultLogLevel: "INFO",
    defaultLoggerLevels: { "VueUtils.mjs": "INFO" },
    bootswatchURL: "https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist",
    // Landing page: no sidebar tree, single root route.
    root: { icon: "fa-house", depth: 0, endpoint: "/", isLeaf: false, isRoot: true, name: "", path: [], children: [] },
    routes: [ { path: '/', name: 'root', children: [] } ],
    components: defaultVueComponents(CDN),
    islands: [],
  }
  initLogger(config)
  await apiMain.init("app-default", config)
</script>

<script src="https://cdn.jsdelivr.net/npm/c0ckp1t@1.0.15/js_ext/bootstrap.bundle.min.js"></script>
